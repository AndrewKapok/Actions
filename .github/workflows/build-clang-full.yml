name: Build LLVM MinGW (MSYS2 UCRT64, no w64devkit)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout llvm-project
        uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          fetch-depth: 1
          path: llvm-project
          # ref: llvmorg-19.1.0  # 固定release tag，加快编译

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            cmake
            ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip

      - name: Verify toolchain
        run: |
          gcc --version
          g++ --version
          cmake --version
          ninja --version

      - name: Create build dir
        run: |
          cd llvm-project
          mkdir -p build
          cd build

      - name: CMake configure
        working-directory: llvm-project/build
        run: |
          cmake -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld;clang-tools-extra" \
            -DCMAKE_INSTALL_PREFIX="${PWD}/install" \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            ../llvm

      - name: Build
        working-directory: llvm-project/build
        run: |
          cmake --build . -- -j${NUMBER_OF_PROCESSORS}

      - name: Install to ./install
        working-directory: llvm-project/build
        run: |
          cmake --install .

      - name: Package noruntime (without mingw runtime dlls)
        working-directory: llvm-project/build
        run: |
          Compress-Archive -Path install -DestinationPath llvm-mingw-noruntime.zip

      - name: Copy UCRT64 runtime dlls into install/bin
        working-directory: llvm-project/build
        run: |
          $mingwBin = "C:\msys64\ucrt64\bin"
          $dstBin = "install\bin"
          Copy-Item "$mingwBin\libstdc++-6.dll" $dstBin
          Copy-Item "$mingwBin\libgcc_s_seh-1.dll" $dstBin
          Copy-Item "$mingwBin\libwinpthread-1.dll" $dstBin

      - name: Package with runtime
        working-directory: llvm-project/build
        run: |
          Compress-Archive -Path install -DestinationPath llvm-mingw-withruntime.zip

      - name: Upload artifact noruntime
        uses: actions/upload-artifact@v4
        with:
          name: llvm-mingw-noruntime
          path: llvm-project/build/llvm-mingw-noruntime.zip

      - name: Upload artifact with runtime
        uses: actions/upload-artifact@v4
        with:
          name: llvm-mingw-withruntime
          path: llvm-project/build/llvm-mingw-withruntime.zip
