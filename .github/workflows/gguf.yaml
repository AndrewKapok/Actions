name: Convert Model to GGUF and Upload to HF Private Repo

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: 'Hugging Face 仓库 ID（例如 meta-llama/Llama-2-7b-hf）'
        required: true
      quantize:
        description: '量化类型（可选，如 q4_0、q8_0，留空则不量化）'
        required: false
        default: ''

jobs:
  convert-and-upload:
    runs-on: macos-latest

    steps:
      # 1. 检出当前仓库（使用最新版 checkout v6）
      - name: Checkout current repository
        uses: actions/checkout@v6

      # 2. 准备 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖：预编译的 llama.cpp 和 Python 库
      - name: Install dependencies
        run: |
          brew install llama.cpp
          pip install huggingface_hub

      # 4. 克隆 llama.cpp 源码（仅为了获取转换脚本）
      - name: Clone llama.cpp for conversion script
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git

      # 5. 从 Hugging Face 下载指定仓库的所有模型文件
      - name: Download model from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          import os
          repo_id = '${{ github.event.inputs.repo_id }}'
          print(f'正在下载 {repo_id} ...')
          snapshot_download(
              repo_id=repo_id,
              local_dir='./model',
              local_dir_use_symlinks=False,
              token=os.getenv('HF_TOKEN')
          )
          "

      # 6. 转换为 GGUF（f16，可后续量化）
      - name: Convert to GGUF
        run: |
          REPO_ID="${{ github.event.inputs.repo_id }}"
          MODEL_NAME=$(basename "$REPO_ID")
          python llama.cpp/convert_hf_to_gguf.py ./model \
            --outtype f16 \
            --outfile "${MODEL_NAME}.gguf"

      # 7. （可选）使用 brew 安装的 llama.cpp 工具进行量化
      - name: Quantize (optional)
        if: ${{ github.event.inputs.quantize != '' }}
        run: |
          QUANT="${{ github.event.inputs.quantize }}"
          MODEL_NAME=$(basename "${{ github.event.inputs.repo_id }}")
          llama-quantize "${MODEL_NAME}.gguf" "${MODEL_NAME}-${QUANT}.gguf" ${QUANT}
          # 替换原文件为量化版
          mv "${MODEL_NAME}-${QUANT}.gguf" "${MODEL_NAME}.gguf"

      # 8. 上传 GGUF 到同名私有 Hugging Face 仓库
      - name: Upload to Hugging Face private repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi, create_repo
          import os
          api = HfApi()
          repo_id = '${{ github.event.inputs.repo_id }}'
          # 创建私有仓库（若已存在则跳过）
          try:
              create_repo(repo_id, private=True, token=os.getenv('HF_TOKEN'), exist_ok=True)
              print(f'私有仓库 {repo_id} 已就绪')
          except Exception as e:
              print(f'创建仓库时出现警告: {e}')
          # 上传文件
          model_name = repo_id.split('/')[-1]
          gguf_file = f'{model_name}.gguf'
          api.upload_file(
              path_or_fileobj=gguf_file,
              path_in_repo=gguf_file,
              repo_id=repo_id,
              repo_type='model',
              token=os.getenv('HF_TOKEN')
          )
          print('上传完成！')
          "
